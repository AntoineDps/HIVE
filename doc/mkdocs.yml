site_name: HIVE
site_description: Hydrodynamic Identification and Validation Environment — a Python framework for WEC modelling, system identification and benchmarking.
site_author: Antoine Dupuis
repo_url: https://github.com/AntoineDps/HIVE
repo_name: AntoineDps/HIVE

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - User Manual:
      - Pipeline Overview: manual/pipeline_overview.md
      - run_handle_data: manual/run_handle_data.md
      - run_validate: manual/run_validate.md
      - run_identify: manual/run_identify.md
      - run_signals: manual/run_signals.md
      - Input Config Reference: manual/config_reference.md
      - Naming Conventions: manual/naming_conventions.md
      - Output Files & Folder Structure: manual/output_files.md
  - Theory:
      - Hydrodynamics: theory/hydrodynamics.md
      - Force Terms: theory/force_terms.md
      - System Identification: theory/identification.md
      - Models & Solvers: theory/models_solvers.md
      - Metrics: theory/metrics.md
  - Roadmap: roadmap.md
