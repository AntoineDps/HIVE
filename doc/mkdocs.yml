site_name: WEC Modeling Benchmark
site_description: User manual for the WEC modeling and identification pipeline
site_author: Antoine
docs_dir: content
theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Pipeline Overview: pipeline.md
  - Scripts:
    - run_handle_data: scripts/run_handle_data.md
    - run_validate: scripts/run_validate.md
    - run_identify: scripts/run_identify.md
  - Configuration:
    - model.json: config/model_json.md
    - validate run.json: config/validate_json.md
    - identify config: config/identify_json.md
  - Concepts:
    - Hydrodynamics: concepts/hydro.md
    - Models & Force Terms: concepts/models.md
    - Solvers & Interpolation: concepts/solvers.md
    - Metrics: concepts/metrics.md
  - Roadmap: roadmap/roadmap.md 
